<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con Node</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <header>
        <h1>Ejercicios con JavaScript</h1>
    </header>
    <main>
        <section class="ejercicios">
            <h2 id="titulo-arreglos"> Arreglos del código <code>01-arreglos.js</code></h2>
            <p>Datos de prueba con JS</p>
            <div class="tabla-scroll">
                <table id="tabla-talleres"> 
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <form id="form-arreglos" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo">Operación</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">forEach - Lista Simple</option>
                        <option value="map">map - Copia solo Nombres</option>
                        <option value="filter">filter - Filtrar Talleres con cupo lleno</option>
                        <option value="find">find - Buscar por el nombre del instructor</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglos"></output>
        </section>

        <section class="ejercicios">
    <h2 id="titulo-objetos">Objetos del código </h2>
    <p>Operaciones con Object y JSON</p>

    <form id="form-objetos" class="formulario">
        <div class="campos">
            <label for="operacion-objeto">Operación</label>
            <select name="operacion-objeto" id="operacion-objeto">
                <option value="keys">Object.keys - Solo Nombres de Propiedades</option>
                <option value="values">Object.values - Solo Valores</option>
                <option value="entries">Object.entries - Propiedad: Valor</option>
                <option value="stringify">JSON.stringify - Convertir a Texto</option>
                <option value="parse">JSON.parse - Texto a Objeto (Extraer nombre)</option>
            </select>
        </div>
        
        <button type="submit">Ejecutar</button>
    </form>
    
    <output class="resultado" id="resultado-objeto" for="form-objetos"></output>
</section>
    </main>
    <p>Presiona para volver al index principal <a href="../../index.html">aqui</a></p>
    <footer>
        <p>Para Mejor contacto venga a la Batiz</p>
    </footer>
    <script src="./js/app.js"></script>
</body>
</html>
